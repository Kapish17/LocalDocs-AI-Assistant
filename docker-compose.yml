# Local development / demo stack:
#   docker compose up --build
# Frontend -> http://localhost:5173
# Backend  -> http://localhost:8000
#
# Secrets come from backend/.env (create it from backend/.env.example — it
# is NOT baked into any image, only passed in at container start via
# env_file). Nothing here creates or requires any cloud resources.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    env_file:
      - backend/.env
    volumes:
      # Keep the knowledge base's build inputs/outputs on the host so
      # documents uploaded through the app survive `docker compose up`
      # restarts instead of resetting with every rebuilt container.
      - ./data:/app/data
      - ./database:/app/database

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Vite bakes this in at build time — the browser talks to the
        # backend directly at this URL, not through the frontend container.
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:8080"
    environment:
      - PORT=8080
    depends_on:
      - backend
